site_name: Molo Documentation
site_description: Current Molo spatial-omics workflow, R functions, Python CLI, and
  FastAPI reference
site_url: https://docs.molopipeline.site/en/
repo_url: https://github.com/AI4Bread/Molo-tutorial
repo_name: AI4Bread/Molo-tutorial
edit_uri: ''
docs_dir: source_en
site_dir: site/en
strict: true
theme:
  name: material
  language: en
  logo: assets/molo.svg
  favicon: assets/molo.svg
  palette:
    primary: teal
    accent: amber
  features:
  - navigation.sections
  - navigation.top
  - navigation.indexes
  - content.code.copy
  - search.highlight
plugins:
- search:
    lang: en
markdown_extensions:
- admonition
- attr_list
- tables
- toc:
    permalink: true
- pymdownx.details
- pymdownx.superfences
nav:
- Home: index.md
- Get started:
  - Introduction: introduction.md
  - Model architecture: architecture.md
  - Installation: getting-started.md
  - Data preparation: data-preparation.md
  - Web workflow: web-workflow.md
  - Basic R pipeline: basic-pipeline.md
- Reference:
  - R functions: r-functions.md
  - Complete R parameters: reference/r-parameters.md
  - Python CLI: python-cli.md
  - Complete CLI options: reference/cli-options.md
  - HTTP API: api.md
  - Complete HTTP routes: reference/http-routes.md
  - Defaults and tuning: parameters.md
  - Results and limitations: results.md
- Operations:
  - Server deployment: deployment.md
  - Documentation maintenance: documentation-site.md
  - Version and source provenance: provenance.md
  - FAQ: faq.md
extra:
  generator: false
  alternate:
  - name: English
    link: /en/
    lang: en
  - name: 简体中文
    link: /
    lang: zh
